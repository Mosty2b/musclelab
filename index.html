<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuscleMap — Guide anatomique interactif</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

  <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
    <defs>
      <filter id="organic-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a3b32" flood-opacity="0.15"/>
      </filter>
    </defs>
  </svg>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-mark">M</span>
        <span class="logo-text">MuscleMap</span>
      </div>
      <p class="header-sub">Guide anatomique interactif de la musculation</p>
      <div class="header-stats">
        <span>45 exercices</span><span class="dot">·</span>
        <span>12 groupes</span><span class="dot">·</span>
        <span>Libre & machine</span>
      </div>
    </div>
  </header>

  <main class="app-layout">
    <section class="body-panel" id="bodyPanel">
      <div class="body-panel-header">
        <h2 class="panel-title">Vue anatomique</h2>
        <div class="view-toggle">
          <button class="view-btn active" id="btnAnterior" onclick="setView('anterior')">Face avant</button>
          <button class="view-btn" id="btnPosterior" onclick="setView('posterior')">Face arrière</button>
        </div>
      </div>

      <div class="body-container breathing-animation">
        <div id="figAnterior" class="body-figure">
           <p style="text-align:center; color: var(--text-muted); padding: 50px;">[Insérer ton SVG Face Avant ici]</p>
        </div>
        <div id="figPosterior" class="body-figure hidden">
           <p style="text-align:center; color: var(--text-muted); padding: 50px;">[Insérer ton SVG Face Arrière ici]</p>
        </div>
      </div>

      <div class="muscle-badge" id="muscleBadge">
        <span id="badgeText">Cliquez sur un exercice ou un muscle</span>
      </div>
    </section>

    <section class="exercise-panel" id="exercisePanel">
      <div class="exercise-panel-header">
        <h2 class="panel-title">Exercices</h2>
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all" onclick="filterExercises('all', this)">Tous</button>
          <button class="filter-btn" data-filter="free" onclick="filterExercises('free', this)">Libres</button>
          <button class="filter-btn" data-filter="machine" onclick="filterExercises('machine', this)">Machines</button>
        </div>
      </div>

      <div class="exercise-search">
        <input type="text" id="searchInput" placeholder="Rechercher un exercice…" oninput="searchExercises(this.value)">
      </div>

      <div class="exercise-list" id="exerciseList">
        </div>
    </section>

    <section class="detail-panel" id="detailPanel">
      <button class="back-btn" onclick="closeDetail()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Retour
      </button>
      <div class="detail-content" id="detailContent">
        </div>
    </section>
  </main>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
