<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuscleMap — Guide anatomique interactif</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-mark">M</span>
      <span class="logo-text">MuscleMap</span>
    </div>
    <p class="header-sub">Guide anatomique interactif de la musculation</p>
    <div class="header-stats">
      <span>45 exercices</span>
      <span class="dot">·</span>
      <span>12 groupes musculaires</span>
      <span class="dot">·</span>
      <span>Libre &amp; machine</span>
    </div>
  </div>
</header>

<main class="app-layout">

  <!-- LEFT: Body viewer -->
  <section class="body-panel" id="bodyPanel">
    <div class="body-panel-header">
      <h2 class="panel-title">Vue anatomique</h2>
      <div class="view-toggle">
        <button class="view-btn active" id="btnAnterior" onclick="setView('anterior')">Face avant</button>
        <button class="view-btn" id="btnPosterior" onclick="setView('posterior')">Face arrière</button>
      </div>
    </div>

    <div class="body-figures">
      <!-- ANTERIOR SVG -->
      <div class="body-figure" id="figAnterior">
        <svg id="svgAnterior" viewBox="0 0 220 520" xmlns="http://www.w3.org/2000/svg">
          <!-- HEAD -->
          <g class="muscle-group" data-muscle="none">
            <ellipse cx="110" cy="35" rx="26" ry="30" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.8"/>
            <!-- Face features -->
            <ellipse cx="101" cy="30" rx="3.5" ry="4" fill="#D4CFC7"/>
            <ellipse cx="119" cy="30" rx="3.5" ry="4" fill="#D4CFC7"/>
            <path d="M104 42 Q110 47 116 42" stroke="#C8C4BC" stroke-width="0.8" fill="none"/>
          </g>

          <!-- NECK -->
          <g class="muscle-group" data-muscle="none">
            <rect x="101" y="62" width="18" height="18" rx="2" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- TRAPEZIUS UPPER (anterior view - shoulders) -->
          <g class="muscle-group" id="ant-trapezius" data-muscle="trapezius" onclick="selectMuscle('trapezius')" style="cursor:pointer">
            <path d="M101 63 Q80 68 65 80 Q60 90 65 95 Q80 88 100 82 L110 80 L120 82 Q140 88 155 95 Q160 90 155 80 Q140 68 119 63 Z" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- PECTORALS -->
          <g class="muscle-group" id="ant-pectorals" data-muscle="pectorals" onclick="selectMuscle('pectorals')" style="cursor:pointer">
            <path d="M78 86 Q70 92 68 108 Q68 118 78 120 Q90 122 100 118 L110 115 L120 118 Q130 122 142 120 Q152 118 152 108 Q150 92 142 86 Q130 82 120 82 L110 80 L100 82 Z" fill="#DDD9D1" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M110 115 Q108 100 100 94 Q90 90 82 92" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M110 115 Q112 100 120 94 Q130 90 138 92" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- DELTOIDS anterior -->
          <g class="muscle-group" id="ant-deltoids" data-muscle="deltoids" onclick="selectMuscle('deltoids')" style="cursor:pointer">
            <path d="M65 80 Q55 90 52 108 Q52 122 62 128 Q70 132 76 125 Q80 118 80 108 Q80 95 78 86 Z" fill="#DDD9D1" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M155 80 Q165 90 168 108 Q168 122 158 128 Q150 132 144 125 Q140 118 140 108 Q140 95 142 86 Z" fill="#DDD9D1" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- BICEPS -->
          <g class="muscle-group" id="ant-biceps" data-muscle="biceps" onclick="selectMuscle('biceps')" style="cursor:pointer">
            <path d="M62 128 Q55 140 54 158 Q54 172 62 178 Q70 182 76 174 Q80 165 80 150 Q80 135 76 125 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M158 128 Q165 140 166 158 Q166 172 158 178 Q150 182 144 174 Q140 165 140 150 Q140 135 144 125 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <!-- Separation line -->
            <path d="M65 148 Q68 155 65 162" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M155 148 Q152 155 155 162" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- FOREARMS anterior -->
          <g class="muscle-group" id="ant-forearms" data-muscle="forearms" onclick="selectMuscle('forearms')" style="cursor:pointer">
            <path d="M62 178 Q56 192 56 212 Q57 226 64 230 Q70 232 76 224 Q80 214 80 200 Q80 186 76 174 Z" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M158 178 Q164 192 164 212 Q163 226 156 230 Q150 232 144 224 Q140 214 140 200 Q140 186 144 174 Z" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- HANDS -->
          <g class="muscle-group" data-muscle="none">
            <ellipse cx="60" cy="240" rx="10" ry="14" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
            <ellipse cx="160" cy="240" rx="10" ry="14" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- ABDOMINALS -->
          <g class="muscle-group" id="ant-abdominals" data-muscle="abdominals" onclick="selectMuscle('abdominals')" style="cursor:pointer">
            <path d="M88 120 Q78 128 76 145 L76 190 Q80 200 88 202 L110 204 L132 202 Q140 200 144 190 L144 145 Q142 128 132 120 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <!-- Rectus abdominis grid lines -->
            <path d="M88 138 Q110 140 132 138" stroke="#C4C0B8" stroke-width="0.6" fill="none"/>
            <path d="M86 155 Q110 157 134 155" stroke="#C4C0B8" stroke-width="0.6" fill="none"/>
            <path d="M84 172 Q110 174 136 172" stroke="#C4C0B8" stroke-width="0.6" fill="none"/>
            <path d="M83 189 Q110 191 137 189" stroke="#C4C0B8" stroke-width="0.6" fill="none"/>
            <line x1="110" y1="120" x2="110" y2="204" stroke="#C4C0B8" stroke-width="0.6"/>
          </g>

          <!-- OBLIQUES -->
          <g class="muscle-group" id="ant-obliques" data-muscle="obliques" onclick="selectMuscle('obliques')" style="cursor:pointer">
            <path d="M76 145 Q65 155 64 175 Q65 192 76 200 Q80 202 88 202 L88 145 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M144 145 Q155 155 156 175 Q155 192 144 200 Q140 202 132 202 L132 145 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- HIP FLEXORS / GROIN -->
          <g class="muscle-group" id="ant-hipflexors" data-muscle="hipflexors" onclick="selectMuscle('hipflexors')" style="cursor:pointer">
            <path d="M88 202 Q80 210 78 222 Q82 228 90 230 L110 232 L130 230 Q138 228 142 222 Q140 210 132 202 Z" fill="#DDD9D1" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- QUADRICEPS -->
          <g class="muscle-group" id="ant-quadriceps" data-muscle="quadriceps" onclick="selectMuscle('quadriceps')" style="cursor:pointer">
            <path d="M78 228 Q68 242 66 270 Q66 300 72 320 Q78 334 88 336 Q98 338 106 330 L110 320 L114 330 Q122 338 132 336 Q142 334 148 320 Q154 300 154 270 Q152 242 142 228 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <!-- Quad separation lines -->
            <path d="M84 260 Q110 264 136 260" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M82 290 Q110 294 138 290" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M80 265 Q84 290 86 315" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M140 265 Q136 290 134 315" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- KNEES -->
          <g class="muscle-group" data-muscle="none">
            <ellipse cx="90" cy="344" rx="16" ry="12" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
            <ellipse cx="130" cy="344" rx="16" ry="12" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- TIBIALIS / CALVES anterior -->
          <g class="muscle-group" id="ant-calves" data-muscle="calves" onclick="selectMuscle('calves')" style="cursor:pointer">
            <path d="M76 352 Q70 368 70 390 Q70 416 76 430 Q82 440 90 440 Q98 440 102 430 Q106 416 106 390 Q106 365 100 350 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M144 352 Q150 368 150 390 Q150 416 144 430 Q138 440 130 440 Q122 440 118 430 Q114 416 114 390 Q114 365 120 350 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- FEET -->
          <g class="muscle-group" data-muscle="none">
            <path d="M74 438 Q68 450 66 462 Q70 468 90 468 Q102 468 106 460 Q104 448 100 438 Z" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M146 438 Q152 450 154 462 Q150 468 130 468 Q118 468 114 460 Q116 448 120 438 Z" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>
        </svg>
      </div>

      <!-- POSTERIOR SVG -->
      <div class="body-figure hidden" id="figPosterior">
        <svg id="svgPosterior" viewBox="0 0 220 520" xmlns="http://www.w3.org/2000/svg">
          <!-- HEAD back -->
          <g class="muscle-group" data-muscle="none">
            <ellipse cx="110" cy="35" rx="26" ry="30" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.8"/>
          </g>

          <!-- NECK back -->
          <g class="muscle-group" data-muscle="none">
            <rect x="101" y="62" width="18" height="18" rx="2" fill="#D8D4CC" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- TRAPEZIUS (back view - large) -->
          <g class="muscle-group" id="post-trapezius" data-muscle="trapezius" onclick="selectMuscle('trapezius')" style="cursor:pointer">
            <path d="M101 63 Q80 70 65 85 Q58 98 62 112 Q68 120 78 118 Q90 114 100 108 L110 104 L120 108 Q130 114 142 118 Q152 120 158 112 Q162 98 155 85 Q140 70 119 63 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <!-- Trapezius lines -->
            <path d="M110 63 Q110 80 110 104" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M78 78 Q94 88 110 92 Q126 88 142 78" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- DELTOIDS posterior -->
          <g class="muscle-group" id="post-deltoids" data-muscle="deltoids" onclick="selectMuscle('deltoids')" style="cursor:pointer">
            <path d="M62 112 Q52 122 50 140 Q50 155 60 162 Q68 166 76 158 Q80 148 80 135 Q80 120 78 118 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M158 112 Q168 122 170 140 Q170 155 160 162 Q152 166 144 158 Q140 148 140 135 Q140 120 142 118 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- RHOMBOIDS / UPPER BACK -->
          <g class="muscle-group" id="post-rhomboids" data-muscle="rhomboids" onclick="selectMuscle('rhomboids')" style="cursor:pointer">
            <path d="M100 108 Q90 114 82 120 Q78 128 80 138 Q82 146 90 148 L110 150 L130 148 Q138 146 140 138 Q142 128 138 120 Q130 114 120 108 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M110 108 L110 150" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- LATS -->
          <g class="muscle-group" id="post-lats" data-muscle="lats" onclick="selectMuscle('lats')" style="cursor:pointer">
            <path d="M78 118 Q65 135 62 162 Q62 188 68 202 Q76 214 88 218 L88 148 Q84 138 82 128 Z" fill="#CFCBC3" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M142 118 Q155 135 158 162 Q158 188 152 202 Q144 214 132 218 L132 148 Q136 138 138 128 Z" fill="#CFCBC3" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- LOWER BACK / ERECTOR SPINAE -->
          <g class="muscle-group" id="post-lowerback" data-muscle="lowerback" onclick="selectMuscle('lowerback')" style="cursor:pointer">
            <path d="M90 148 L88 218 Q88 230 90 238 L110 240 L130 238 Q132 230 132 218 L130 148 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M100 148 L98 240" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M120 148 L122 240" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- TRICEPS -->
          <g class="muscle-group" id="post-triceps" data-muscle="triceps" onclick="selectMuscle('triceps')" style="cursor:pointer">
            <path d="M60 162 Q52 175 50 198 Q50 214 58 220 Q66 226 76 218 Q80 208 80 192 Q80 174 76 158 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M160 162 Q168 175 170 198 Q170 214 162 220 Q154 226 144 218 Q140 208 140 192 Q140 174 144 158 Z" fill="#D9D5CD" stroke="#C8C4BC" stroke-width="0.7"/>
            <!-- Triceps heads line -->
            <path d="M58 185 Q64 195 60 208" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M162 185 Q156 195 160 208" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- FOREARMS posterior -->
          <g class="muscle-group" id="post-forearms" data-muscle="forearms" onclick="selectMuscle('forearms')" style="cursor:pointer">
            <path d="M58 220 Q52 236 52 256 Q53 270 60 274 Q66 276 74 268 Q78 258 78 244 Q78 230 76 218 Z" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M162 220 Q168 236 168 256 Q167 270 160 274 Q154 276 146 268 Q142 258 142 244 Q142 230 144 218 Z" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- HANDS back -->
          <g class="muscle-group" data-muscle="none">
            <ellipse cx="56" cy="284" rx="10" ry="14" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
            <ellipse cx="164" cy="284" rx="10" ry="14" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- GLUTES -->
          <g class="muscle-group" id="post-glutes" data-muscle="glutes" onclick="selectMuscle('glutes')" style="cursor:pointer">
            <path d="M88 238 Q76 246 72 260 Q70 276 76 288 Q84 300 96 302 L110 304 L124 302 Q136 300 144 288 Q150 276 148 260 Q144 246 132 238 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M110 238 L110 304" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- HAMSTRINGS -->
          <g class="muscle-group" id="post-hamstrings" data-muscle="hamstrings" onclick="selectMuscle('hamstrings')" style="cursor:pointer">
            <path d="M76 290 Q66 308 64 335 Q64 360 72 376 Q80 388 92 390 Q102 392 108 382 L110 370 L112 382 Q118 392 128 390 Q140 388 148 376 Q156 360 156 335 Q154 308 144 290 Z" fill="#CFCBC3" stroke="#C8C4BC" stroke-width="0.7"/>
            <!-- Ham lines -->
            <path d="M86 320 Q110 324 134 320" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M84 350 Q110 354 136 350" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- KNEES back -->
          <g class="muscle-group" data-muscle="none">
            <ellipse cx="90" cy="398" rx="15" ry="10" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
            <ellipse cx="130" cy="398" rx="15" ry="10" fill="#E0DCD4" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>

          <!-- CALVES posterior -->
          <g class="muscle-group" id="post-calves" data-muscle="calves" onclick="selectMuscle('calves')" style="cursor:pointer">
            <path d="M76 406 Q68 422 66 446 Q66 468 74 480 Q82 490 92 490 Q100 490 104 480 Q108 468 108 444 Q108 420 100 404 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M144 406 Q152 422 154 446 Q154 468 146 480 Q138 490 128 490 Q120 490 116 480 Q112 468 112 444 Q112 420 120 404 Z" fill="#D4D0C8" stroke="#C8C4BC" stroke-width="0.7"/>
            <!-- Gastrocnemius line -->
            <path d="M80 430 Q85 448 82 465" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
            <path d="M140 430 Q135 448 138 465" stroke="#C4C0B8" stroke-width="0.5" fill="none"/>
          </g>

          <!-- FEET back -->
          <g class="muscle-group" data-muscle="none">
            <path d="M68 488 Q64 498 66 510 Q70 515 90 512 Q102 510 106 502 Q104 492 100 488 Z" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
            <path d="M152 488 Q156 498 154 510 Q150 515 130 512 Q118 510 114 502 Q116 492 120 488 Z" fill="#E8E4DC" stroke="#C8C4BC" stroke-width="0.7"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Active muscle info badge -->
    <div class="muscle-badge" id="muscleBadge">
      <span class="badge-dot"></span>
      <span id="badgeText">Cliquez sur un exercice ou un muscle</span>
    </div>
  </section>

  <!-- RIGHT: Exercise panel -->
  <section class="exercise-panel" id="exercisePanel">
    <div class="exercise-panel-header">
      <h2 class="panel-title">Exercices</h2>
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all" onclick="filterExercises('all', this)">Tous</button>
        <button class="filter-btn" data-filter="free" onclick="filterExercises('free', this)">Libres</button>
        <button class="filter-btn" data-filter="machine" onclick="filterExercises('machine', this)">Machines</button>
      </div>
    </div>

    <div class="exercise-search">
      <input type="text" id="searchInput" placeholder="Rechercher un exercice…" oninput="searchExercises(this.value)">
    </div>

    <div class="exercise-list" id="exerciseList">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- DETAIL PANEL (slides in) -->
  <section class="detail-panel" id="detailPanel">
    <button class="back-btn" onclick="closeDetail()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Retour aux exercices
    </button>

    <div class="detail-content" id="detailContent">
      <!-- Populated by JS -->
    </div>
  </section>

</main>

<script src="data/exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
